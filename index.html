<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Grade 9 English • Interactive Exam Course</title><style>
:root{--bg:#f4f7fa;--paper:#fff;--ink:#192b3d;--muted:#5d6b7c;--line:#dbe3ec;--accent:#176d76;--accent2:#e6f4f2;--good:#126943;--bad:#a02b33;--nav:#122d40}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eca947;outline-offset:3px}button:disabled{cursor:default;opacity:.65}header{background:var(--nav);color:white;padding:26px max(18px,calc((100vw - 1180px)/2));}header p{margin:4px 0 15px;color:#c6d9e3}h1{font-size:clamp(25px,4vw,38px);line-height:1.2;margin:5px 0}small,.small{font-size:13px;color:var(--muted)}header small{color:#c6d9e3;letter-spacing:.07em;text-transform:uppercase}.progress{height:9px;background:#476174;border-radius:20px;overflow:hidden;max-width:600px}.progress i{display:block;background:#74d8c4;height:100%;transition:width .25s}.top{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}.top button{background:#fff;color:var(--nav);border:0;border-radius:9px;padding:9px 13px;font-weight:650}.layout{max-width:1220px;margin:auto;display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;padding:20px}.sidebar{align-self:start;position:sticky;top:10px;max-height:94vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:13px}.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.group{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:17px 5px 6px;font-weight:750}.navitem{border:0;background:white;color:var(--ink);text-align:left;width:100%;padding:8px 9px;border-radius:7px;line-height:1.35;font-size:14px;display:flex;justify-content:space-between;gap:8px}.navitem:hover,.navitem.active{background:var(--accent2);color:#105b62}.done{color:var(--good);font-weight:bold}.panel{border:1px solid var(--line);border-radius:15px;background:white;padding:clamp(17px,3vw,32px);margin-bottom:15px}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:.12em;text-transform:uppercase;font-weight:750}h2{font-size:clamp(24px,3vw,34px);line-height:1.2;margin:8px 0 12px}h3{font-size:20px;margin:0 0 12px}.notes p{padding:13px 15px;margin:10px 0;background:#f6f8fa;border-left:3px solid #79b7b6;border-radius:0 9px 9px 0}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0}.btn{background:var(--accent);color:white;border:1px solid var(--accent);border-radius:9px;padding:10px 15px;font-weight:650}.btn.secondary{background:white;color:var(--accent);border-color:#b8d3d5}.btn:hover{filter:brightness(.96)}.question{border-top:1px solid var(--line);padding:17px 0}.question:first-child{border-top:0}.qtitle{font-weight:700;margin:0 0 10px;white-space:pre-wrap}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{padding:11px 13px;text-align:left;color:var(--ink);background:white;border:1px solid #cbd6e1;border-radius:9px;min-height:48px;line-height:1.4;overflow-wrap:anywhere}.opt:hover{background:#f2f7f7}.opt.correct{background:#e4f5e9;border:2px solid #24905a;color:var(--good)}.opt.wrong{background:#fff0f0;border:2px solid #d66a73;color:var(--bad)}.opt.chosen{background:#e6f4f2;border:2px solid var(--accent)}.opt:disabled{opacity:1}.feedback{padding:10px 12px;border-radius:8px;background:#f0f5f9;margin-top:9px;font-size:14px}.feedback.good{color:var(--good);background:#eaf7ee}.feedback.bad{color:var(--bad);background:#fff0f0}.stats{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0}.stat{flex:1;min-width:110px;background:#f2f6f8;border-radius:9px;padding:12px}.stat strong{font-size:25px;display:block;color:var(--nav)}.stat span{font-size:13px;color:var(--muted)}.tag{font-size:12px;color:var(--muted);display:block}.foot{font-size:13px;color:var(--muted);margin:15px 0}.lesson-select{display:none}details{margin:15px 0}summary{font-weight:650;cursor:pointer}select{padding:9px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.reviewline{padding:12px 0;border-top:1px solid var(--line)}.mobileonly{display:none} @media(max-width:760px){.layout{display:block;padding:12px}.sidebar{display:none;position:static;max-height:50vh;margin-bottom:12px}.sidebar.open{display:block}.mobileonly{display:inline-block}.options{grid-template-columns:1fr}.panel{padding:18px}.lesson-select{display:block;width:100%;margin-bottom:12px}.top button{font-size:14px}}@media print{header,.sidebar,.bar,.top,.lesson-select{display:none}.layout{display:block}.panel{border:0}.question{break-inside:avoid}}
</style></head><body><header><small>2027 • Grade 9 graduation exam preparation</small><h1>English interactive course</h1><p>Phonetics · Lexicology · Morphology · Syntax</p><div class="progress" role="progressbar" aria-label="Lessons mastered" aria-valuemin="0" aria-valuemax="100" id="progress"><i id="fill" style="width:0%"></i></div><p id="progressText" class="small" style="margin:7px 0"></p><div class="top"><button onclick="goHome()">Course home</button><button onclick="examSetup()">Mixed exam</button><button onclick="reviewMistakes()">Review mistakes</button><button class="mobileonly" onclick="document.querySelector('.sidebar').classList.toggle('open')">Topics ☰</button></div></header><div class="layout"><aside class="sidebar"><input class="search" id="search" type="search" placeholder="Search topics…" aria-label="Search topics" oninput="renderNav()"><div id="nav"></div></aside><main id="main" aria-live="polite"></main></div><script>
const lessons=[{"group": "Phonetics", "title": "1. Letters, sounds & pronunciation", "notes": ["English has 26 letters, but more sounds (often about 44 in British English). A letter can represent different sounds: cat /kæt/, city /ˈsɪti/. A sound can have several spellings: see, sea, scene.", "Letter combinations: sh /ʃ/ (ship), ch /tʃ/ (chair), th /θ/ (think) or /ð/ (this), ph /f/ (phone), ng /ŋ/ (sing), ck /k/ (back), ee /iː/ (green). Some letters are silent: know, write, lamb, night. English spelling has exceptions.", "Short vowels: /ɪ/ sit, /e/ bed, /æ/ cat, /ʌ/ cup, /ɒ/ hot (British), /ʊ/ put. Long vowels: /iː/ see, /ɑː/ car, /ɔː/ law, /uː/ blue, /ɜː/ bird. A monophthong has one steady vowel sound; a diphthong glides between sounds: /eɪ/ day, /aɪ/ time, /ɔɪ/ boy, /əʊ/ go, /aʊ/ now, /ɪə/ near, /eə/ hair, /ʊə/ tour (some British accents)."], "qs": [{"q": "Which word contains /ʃ/?", "opts": ["ship", "chip", "sip", "tip"], "why": "The letters sh usually represent /ʃ/."}, {"q": "Which word has a silent k?", "opts": ["know", "kite", "keep", "king"], "why": "The k in initial kn is silent."}, {"q": "Which pair has the same vowel sound?", "opts": ["see – sea", "sit – seat", "full – fool", "cat – cut"], "why": "Both see and sea have /iː/."}, {"q": "Which word contains the diphthong /aɪ/?", "opts": ["time", "team", "ten", "tin"], "why": "Time has a vowel glide /aɪ/."}, {"q": "Which has a short vowel?", "opts": ["ship", "sheep", "food", "bird"], "why": "Ship contains /ɪ/."}, {"q": "Which word begins with /ð/?", "opts": ["this", "thin", "think", "three"], "why": "This has the voiced th sound."}]}, {"group": "Phonetics", "title": "2. Consonants, syllables & stress", "notes": ["Voiced consonants use vibration in the vocal cords; voiceless consonants do not. Pairs: /p/–/b/, /t/–/d/, /k/–/g/, /f/–/v/, /s/–/z/, /θ/–/ð/, /ʃ/–/ʒ/, /tʃ/–/dʒ/. Other voiced consonants include /m, n, ŋ, l, r, w, j/; /h/ is voiceless.", "An open syllable ends in a vowel sound or, in spelling patterns, a vowel letter: me, go. A closed syllable ends in a consonant: cat, sit. A final silent e often makes the earlier vowel sound like its letter name: cap → cape, bit → bite. These are useful patterns, not universal rules.", "Word stress means one syllable is stronger: TAble, beGIN, imPORtant, eduCAtion. Stress can distinguish noun and verb: REcord (noun), reCORD (verb). The IPA mark ˈ comes before the stressed syllable."], "qs": [{"q": "Which consonant is voiced?", "opts": ["/b/", "/p/", "/t/", "/f/"], "why": "/b/ uses vocal-cord vibration."}, {"q": "Which is the voiceless partner of /z/?", "opts": ["/s/", "/d/", "/v/", "/g/"], "why": "/s/ and /z/ have the same mouth position but different voicing."}, {"q": "Which word has an open syllable?", "opts": ["go", "cat", "bed", "sit"], "why": "Go ends in a vowel sound."}, {"q": "Which word has /eɪ/?", "opts": ["cape", "cap", "cup", "cop"], "why": "Silent e changes the vowel in cape."}, {"q": "Where is the stress in important?", "opts": ["im-POR-tant", "IM-por-tant", "im-por-TANT", "All syllables equally"], "why": "The second syllable is stressed."}, {"q": "Which is the usual noun stress?", "opts": ["REcord", "reCORD", "recORDed", "reCORding"], "why": "The noun record has first-syllable stress."}]}, {"group": "Lexicology", "title": "3. Word meaning & structure", "notes": ["Lexical meaning is the dictionary meaning (book = a written work); grammatical meaning expresses such features as number, tense or word class (books = plural; walked = past). Context determines meaning.", "Simple words have one root (book, kind). Derived words add affixes (kindness, unhappy). Compound words combine roots (toothbrush, classroom, bus stop). Some words have one common meaning; polysemous words have several related meanings: head of a person, head of a department.", "Synonyms have similar meanings (large/big, begin/start); antonyms have opposite meanings (early/late, generous/selfish). Synonyms are not always interchangeable in every context."], "qs": [{"q": "Which is a derived word?", "opts": ["unhappy", "book", "sun", "classroom"], "why": "Un- is a prefix attached to happy."}, {"q": "Which is a compound word?", "opts": ["toothbrush", "teacher", "happy", "quickly"], "why": "Tooth + brush combines two roots."}, {"q": "What grammatical meaning does -s express in books?", "opts": ["plural", "past", "comparison", "possession"], "why": "Books means more than one book."}, {"q": "Choose a synonym of begin.", "opts": ["start", "finish", "refuse", "lose"], "why": "Begin and start have similar meanings."}, {"q": "Choose an antonym of generous.", "opts": ["selfish", "kind", "helpful", "friendly"], "why": "Selfish contrasts with generous."}, {"q": "The head of a company and the head of a person illustrate…", "opts": ["polysemy", "plurality", "antonyms", "silent letters"], "why": "Head has several related meanings."}]}, {"group": "Lexicology", "title": "4. Phrasal verbs", "notes": ["Phrasal and related multi-word verbs combine a verb with a particle or preposition; their meaning can differ from the base verb. Look after = take care of; turn off = stop a machine/light; put off = postpone; give up = stop trying; find out = discover; pick up = collect; look for = search; look up = find information; get on = board; take off = remove or leave the ground.", "Separable verbs: turn off the TV / turn the TV off / turn it off (pronoun goes in the middle). Inseparable: look after the child / look after him, not look him after."], "qs": [{"q": "Please ___ the lights before leaving.", "opts": ["turn off", "look after", "give up", "find out"], "why": "Turn off means switch off."}, {"q": "She ___ her younger brother every afternoon.", "opts": ["looks after", "takes off", "puts off", "gives up"], "why": "Look after means care for."}, {"q": "The meeting was delayed. They ___ it.", "opts": ["put off", "looked after", "took off", "turned on"], "why": "Put off means postpone."}, {"q": "Choose the correct sentence.", "opts": ["Turn it off.", "Turn off it.", "Look him after.", "Give off it up."], "why": "A pronoun object goes between turn and off."}, {"q": "I need to ___ this word in a dictionary.", "opts": ["look up", "look after", "give up", "take off"], "why": "Look up means find information."}, {"q": "Don't ___; keep trying.", "opts": ["give up", "take off", "turn on", "look for"], "why": "Give up means stop trying."}]}, {"group": "Lexicology", "title": "5. Word formation: nouns", "notes": ["Noun suffixes: -er (teach → teacher), -ment (develop → development), -tion/-sion (educate → education; decide → decision), -ness (kind → kindness), -ity (active → activity), -ing (swim → swimming), -th (grow → growth), -dom (free → freedom), -ship (friend → friendship).", "Names of people/nationalities can use -i (Iraqi), -ian/-an (Canadian, American), -ese (Japanese), -ess (actress, lioness). Some forms change spelling; many modern job titles are gender-neutral (actor, teacher)."], "qs": [{"q": "The noun of kind is…", "opts": ["kindness", "kindly", "kinder", "unkind"], "why": "Add -ness to form an abstract noun."}, {"q": "The noun of decide is…", "opts": ["decision", "decidement", "decidely", "decidable"], "why": "Decide changes to decision with -sion."}, {"q": "Which word denotes a person?", "opts": ["teacher", "freedom", "growth", "activity"], "why": "The suffix -er can denote a person doing an action."}, {"q": "The noun of free is…", "opts": ["freedom", "freely", "freeful", "freeless"], "why": "Free + -dom forms freedom."}, {"q": "Which is the correct noun form of active?", "opts": ["activity", "activenessly", "actively", "activer"], "why": "Activity uses -ity with a spelling change."}, {"q": "A person from Japan is…", "opts": ["Japanese", "Japanian", "Japaness", "Japaner"], "why": "Japanese uses -ese."}, {"q": "Choose the noun formed with -ship.", "opts": ["friendship", "friendly", "friendless", "befriend"], "why": "Friendship describes a relationship."}]}, {"group": "Lexicology", "title": "6. Word formation: adjectives, numbers & adverbs", "notes": ["Adjective suffixes: -less (careless), -ful (careful), -able (readable), -y (rainy), -ly (friendly, lovely, lonely, elderly, lively, cowardly, weekly), -ous (dangerous), -ish (childish). Not every -ly word is an adverb.", "Prefixes: pre- (prepaid = paid beforehand), un- (unhappy), in- (incorrect), im- (impossible), il- (illegal), ir- (irregular). Negative prefixes depend on the word.", "Number suffixes: -teen (thirteen), -ty (thirty), -th (fourth). Adverbs often take -ly: quick → quickly, happy → happily, gentle → gently. Irregular/common exceptions: good → well; fast → fast; hard → hard (hardly means almost not)."], "qs": [{"q": "The opposite of possible is…", "opts": ["impossible", "unpossible", "ilpossible", "irpossible"], "why": "Use im- before possible."}, {"q": "Which -ly word is an adjective?", "opts": ["friendly", "quickly", "slowly", "carefully"], "why": "Friendly describes a person or thing."}, {"q": "The adjective meaning without hope is…", "opts": ["hopeless", "hopeful", "hopely", "hopement"], "why": "-less means without."}, {"q": "Choose the correct adjective: a ___ road.", "opts": ["dangerous", "dangerously", "danger", "dangerment"], "why": "Danger + -ous forms an adjective."}, {"q": "Choose the number 40.", "opts": ["forty", "fourty", "fourteen", "fourth"], "why": "Forty has -ty and no u."}, {"q": "She answered the question ___.", "opts": ["correctly", "correct", "correction", "correctness"], "why": "An adverb describes how she answered."}, {"q": "He plays football very ___.", "opts": ["well", "good", "goodly", "wellly"], "why": "Well is the usual adverb of good."}]}, {"group": "Morphology", "title": "7. Nouns: types & countability", "notes": ["A noun names a person, place, thing or idea. Common nouns (city, teacher) name general classes; proper nouns (Baku, Ali, Monday) name particular entities and take capital letters. Concrete nouns name physical things (table); abstract nouns name ideas or feelings (love, courage). Collective nouns name groups (team, family, class); material nouns name substances (gold, wood, water).", "Countable nouns have singular and plural forms (an apple, two apples). Uncountable nouns are not usually counted individually (water, information, advice, furniture, money, knowledge). Use some, much, a little or a unit: a piece of advice, a glass of water. Some nouns can be both: chicken (meat) / a chicken (animal); paper (material) / a paper (document)."], "qs": [{"q": "Which is a proper noun?", "opts": ["Baku", "city", "school", "country"], "why": "Baku is a particular city name."}, {"q": "Which is abstract?", "opts": ["honesty", "chair", "river", "pencil"], "why": "Honesty is a quality, not a physical object."}, {"q": "Which is a collective noun?", "opts": ["team", "gold", "water", "happiness"], "why": "A team is a group."}, {"q": "Choose the material noun.", "opts": ["gold", "student", "idea", "family"], "why": "Gold is a substance."}, {"q": "Which is correct?", "opts": ["some information", "an information", "two informations", "many information"], "why": "Information is normally uncountable."}, {"q": "I need ___.", "opts": ["a piece of advice", "an advice", "three advices", "many advice"], "why": "Advice is uncountable; use a piece of."}]}, {"group": "Morphology", "title": "8. Singular, plural & special nouns", "notes": ["Regular plurals: book/books, bus/buses, box/boxes, baby/babies, boy/boys, leaf/leaves (but roof/roofs). Some -o nouns add -es (tomato/tomatoes), others -s (photo/photos).", "Irregular plurals: man/men, woman/women, child/children, tooth/teeth, foot/feet, mouse/mice, person/people, ox/oxen. Same singular and plural: sheep, deer, often fish. Usually singular-only/uncountable: news (is), mathematics (is), information, furniture, milk. Plural-only: scissors, trousers, glasses (spectacles), clothes; police and people normally take plural verbs. A pair of scissors takes a singular verb."], "qs": [{"q": "One child, three ___.", "opts": ["children", "childs", "childes", "childrens"], "why": "Child has an irregular plural."}, {"q": "Five ___ are in the field.", "opts": ["sheep", "sheeps", "sheepes", "sheepen"], "why": "Sheep is unchanged in the plural."}, {"q": "The news ___ interesting.", "opts": ["is", "are", "were", "have"], "why": "News takes singular agreement."}, {"q": "My trousers ___ new.", "opts": ["are", "is", "was", "has"], "why": "Trousers is plural-only."}, {"q": "Two ___ fell from the tree.", "opts": ["leaves", "leafs", "leafes", "leaf"], "why": "Leaf usually changes f to ves."}, {"q": "The police ___ looking for him.", "opts": ["are", "is", "was", "has"], "why": "Police normally takes a plural verb."}, {"q": "A pair of scissors ___ on the desk.", "opts": ["is", "are", "have", "were"], "why": "The head noun pair is singular."}]}, {"group": "Morphology", "title": "9. Noun cases & possession", "notes": ["The common case is the ordinary noun form (the boy, the boys). The genitive/possessive case shows belonging or relationship. Singular: the girl's bag. Regular plural ending in -s: the girls' bags. Irregular plural: the children's books. Shared possession: Ali and Leyla's room; separate possession: Ali's and Leyla's rooms.", "Use of for many inanimate relationships: the door of the house, the title of the book. Both forms may work with people/animals: the dog's tail / the tail of the dog. Apostrophe possession is also common with time, places, seasons, months, days, celestial bodies: today's news, a week's holiday, Azerbaijan's history, Baku's streets, summer's heat, May's weather, the Earth's surface, the Sun's rays, the Moon's orbit. Inanimate possessives can also be natural in other contexts."], "qs": [{"q": "The books belonging to the children are…", "opts": ["the children's books", "the childrens' books", "the childrens books", "the children books"], "why": "Children is an irregular plural; add 's."}, {"q": "The bags of two girls are…", "opts": ["the girls' bags", "the girl's bags", "the girls bags", "the girl' bags"], "why": "Add only an apostrophe to a regular plural ending in s."}, {"q": "Choose the natural expression.", "opts": ["the roof of the house", "the roof at the house", "the roof from house", "the roof house of"], "why": "Of is common with inanimate relationships."}, {"q": "Choose the correct time possessive.", "opts": ["a week's holiday", "a weeks holiday", "a week' holiday", "a weeks's holiday"], "why": "Singular time noun + 's."}, {"q": "They share one car. It is…", "opts": ["Ali and Leyla's car", "Ali's and Leyla's cars", "Ali and Leylas car", "Ali's and Leylas' car"], "why": "For shared possession, mark the last name."}]}, {"group": "Morphology", "title": "10. Articles: a, an, the & zero article", "notes": ["A/an: one unspecified singular countable noun, first mention, professions. Use a before a consonant sound (a university, a European), an before a vowel sound (an hour, an apple). The: specific/known noun, second mention, unique things (the Sun), superlatives (the best), ordinals (the first), rivers/seas/oceans/mountain ranges (the Nile, the Caspian Sea, the Alps), some country names (the UK, the USA), musical instruments (play the piano).", "Zero article: plural/uncountable nouns in general (Cats are animals; Water is essential), most names (Baku, Azerbaijan, Mount Everest), languages, school subjects, meals, sports (speak English, have breakfast, play football). Institutional expressions: go to school (as a pupil), go to the school (the specific building). A/an cannot be used directly with plurals or uncountable nouns."], "qs": [{"q": "She is ___ engineer.", "opts": ["an", "a", "no article", "some"], "why": "Engineer starts with a vowel sound."}, {"q": "He studies at ___ university.", "opts": ["a", "an", "no article", "some"], "why": "University begins with /j/, a consonant sound."}, {"q": "We waited for ___ hour.", "opts": ["an", "a", "no article", "some"], "why": "Hour begins with a vowel sound because h is silent."}, {"q": "I saw a dog. ___ dog was black.", "opts": ["The", "A", "An", "No article"], "why": "The dog is now identified."}, {"q": "___ water is essential for life.", "opts": ["No article", "A", "An", "The"], "why": "Water in general takes no article."}, {"q": "She plays ___ piano.", "opts": ["the", "a", "an", "no article"], "why": "The is customary with musical instruments in this expression."}, {"q": "Which is correct?", "opts": ["the Caspian Sea", "Caspian Sea", "an Caspian Sea", "a Caspian Sea"], "why": "Sea names normally take the."}, {"q": "He lives in ___ Azerbaijan.", "opts": ["no article", "the", "a", "an"], "why": "Most country names take no article."}]}, {"group": "Morphology", "title": "11. Adjectives: comparison & link verbs", "notes": ["Adjectives describe nouns and do not agree in number: a tall boy, tall boys. They come before a noun or after a linking verb. Positive: tall; comparative: taller; superlative: the tallest. Short adjectives: -er/-est (nice/nicer/nicest, big/bigger/biggest, happy/happier/happiest). Longer adjectives: more/most beautiful. Irregular: good/better/best, bad/worse/worst, far/farther or further/farthest or furthest.", "Use than with comparisons (older than); as + adjective + as for equality; not as/so + adjective + as for inequality. Avoid double comparison: more better is incorrect. Link verbs be, become, seem, feel, smell, taste, look, appear, stay, get, grow, sound take an adjective when describing the subject: The soup tastes good. She looks tired. They grew angry."], "qs": [{"q": "This book is ___ than that one.", "opts": ["more interesting", "interestinger", "most interesting", "the interesting"], "why": "Long adjectives usually use more."}, {"q": "He is the ___ player on the team.", "opts": ["best", "better", "goodest", "most good"], "why": "Good → better → best."}, {"q": "My bag is as heavy ___ yours.", "opts": ["as", "than", "like", "so"], "why": "The pattern is as + adjective + as."}, {"q": "This exam is not so difficult ___ the last one.", "opts": ["as", "than", "that", "like"], "why": "Not so/as … as expresses inequality."}, {"q": "The flowers smell ___.", "opts": ["wonderful", "wonderfully", "wonder", "more wonderfully"], "why": "Smell is a linking verb here; use an adjective."}, {"q": "Today is ___ than yesterday.", "opts": ["worse", "worst", "badder", "more worse"], "why": "Bad has the irregular comparative worse."}, {"q": "Which is correct?", "opts": ["the biggest", "the bigest", "the most biggest", "the biggerest"], "why": "Double the final g before -est."}]}, {"group": "Morphology", "title": "12. Cardinal & ordinal numbers", "notes": ["Cardinal numbers tell how many: one, two, thirteen, thirty, one hundred, two thousand. Ordinals tell position: first, second, third, fourth, fifth, eighth, ninth, twelfth, twentieth, twenty-first. Use the final component as ordinal in compounds: thirty-second. Dates often use ordinal pronunciation: 13 May = the thirteenth of May / May the thirteenth.", "Hundred, thousand, million stay singular after exact numbers: two hundred students; hundreds of students for an indefinite quantity. British English often uses and: one hundred and five."], "qs": [{"q": "What is the ordinal of 12?", "opts": ["twelfth", "twelveth", "twelve", "twelfthth"], "why": "Twelve changes to twelfth."}, {"q": "How do we write 21st in words?", "opts": ["twenty-first", "twentieth-one", "twenty-one", "twenty-oneth"], "why": "Only the last component becomes ordinal."}, {"q": "There are ___ students.", "opts": ["three hundred", "three hundreds", "third hundred", "three hundreds of"], "why": "No plural -s after an exact number."}, {"q": "What is 90?", "opts": ["ninety", "ninty", "nineteen", "ninth"], "why": "Ninety is the cardinal number."}, {"q": "Choose the indefinite quantity.", "opts": ["hundreds of books", "hundred of books", "two hundreds books", "hundreds books"], "why": "Use plural + of for an indefinite number."}]}, {"group": "Morphology", "title": "13. Personal, possessive, demonstrative & reflexive pronouns", "notes": ["Subject (nominative): I, you, he, she, it, we, they. Object (objective): me, you, him, her, it, us, them. Use subjects before the verb and objects after verbs/prepositions: She saw him; with us.", "Dependent possessives precede nouns: my, your, his, her, its, our, their. Independent possessives replace noun phrases: mine, yours, his, hers, ours, theirs (independent its is generally avoided). Its = possessive; it's = it is/has. Demonstratives: this/these (near), that/those (far); this/that singular, these/those plural.", "Reflexive pronouns: myself, yourself, himself, herself, itself, ourselves, yourselves, themselves. Use when subject and object are the same, or for emphasis: She hurt herself; I did it myself. By myself = alone."], "qs": [{"q": "Leyla and I are friends. ___ study together.", "opts": ["We", "Us", "Our", "Ours"], "why": "We is a subject pronoun."}, {"q": "I gave the book to ___.", "opts": ["him", "he", "his", "he is"], "why": "After to, use an object pronoun."}, {"q": "This is my pen. That one is ___.", "opts": ["yours", "your", "you", "yourself"], "why": "Yours replaces your pen."}, {"q": "___ books here are mine.", "opts": ["These", "This", "That", "It"], "why": "These refers to plural things nearby."}, {"q": "The boys hurt ___ while playing.", "opts": ["themselves", "himself", "ourselves", "yourselves"], "why": "The subject is the boys, so use themselves."}, {"q": "The cat is washing ___ paws.", "opts": ["its", "it's", "it", "itself"], "why": "Its is the possessive form before a noun."}]}, {"group": "Morphology", "title": "14. Indefinite pronouns & quantifiers", "notes": ["Some is usual in affirmative sentences; any in negatives and questions: I have some tea; I don't have any tea; Do you have any tea? Use some in offers or requests expecting agreement: Would you like some juice? Can I have some water? Any can mean whichever in affirmatives: Choose any seat. Compounds: somebody/someone/something; anybody/anyone/anything; everybody/everyone/everything; nobody/no one/nothing. These normally take singular verbs.", "Many/few/a few + plural countable nouns; much/little/a little + uncountable nouns. Few/little = almost none (negative idea); a few/a little = some (positive idea). A lot of + both types; a lot can stand alone. Every + singular noun and verb: every student is ready."], "qs": [{"q": "Would you like ___ tea?", "opts": ["some", "many", "few", "nothing"], "why": "Some is natural in offers."}, {"q": "There isn't ___ milk.", "opts": ["any", "many", "few", "a few"], "why": "Any is usual in negative sentences."}, {"q": "I have ___ friends here, so I am not lonely.", "opts": ["a few", "few", "little", "much"], "why": "A few means some and is positive."}, {"q": "There is very ___ time left. Hurry!", "opts": ["little", "few", "a few", "many"], "why": "Time is uncountable; little means almost none."}, {"q": "How ___ books do you have?", "opts": ["many", "much", "little", "a little"], "why": "Books are countable plural."}, {"q": "Everyone ___ ready.", "opts": ["is", "are", "have", "were"], "why": "Everyone takes a singular verb."}, {"q": "I didn't see ___ at home.", "opts": ["anyone", "nobody", "no one", "every of them"], "why": "Use anyone after a negative verb in standard English."}]}, {"group": "Morphology", "title": "15. Interrogative, distributive & negative pronouns", "notes": ["Interrogative pronouns: who (person, subject), whom (person, formal object), whose (possession), what (thing/open choice), which (limited choice). Who is also common as an object in conversation: Who did you meet?", "Both (of) = two together; either (of) = one of two; neither (of) = not one of two. All (of) = entire group; each (of) = members individually; every = all individually. Say each of the students, all of them, both of us, either of the two; every one of the students (not every of). Each/every normally take a singular verb; both takes plural. Either/neither generally take singular agreement in formal exam English, though plural can occur informally with of.", "No + noun (no money); none (of) replaces a noun (none of the books). Nobody/no one/nothing express negatives without not: Nobody came. None may take singular or plural agreement depending on meaning."], "qs": [{"q": "___ bag is this?", "opts": ["Whose", "Who", "Whom", "What"], "why": "Whose asks about ownership."}, {"q": "___ of the two answers is correct; both are wrong.", "opts": ["Neither", "Either", "Both", "All"], "why": "Neither means not one of two."}, {"q": "___ of my parents are teachers.", "opts": ["Both", "Each", "Every", "Neither"], "why": "Both refers to two together and takes plural agreement."}, {"q": "Choose the correct phrase.", "opts": ["every one of the students", "every of the students", "each students", "both student"], "why": "Every one of is the correct construction."}, {"q": "There is ___ sugar left.", "opts": ["no", "none of", "nobody", "nothing of"], "why": "No directly modifies a noun."}, {"q": "___ of the books belongs to me; they are all yours.", "opts": ["None", "Both", "Every", "Someone"], "why": "None means not any."}, {"q": "___ do you prefer, tea or coffee?", "opts": ["Which", "Whose", "Whom", "Who"], "why": "Which asks about a limited choice."}]}, {"group": "Morphology", "title": "16. Verb forms & be, have, do", "notes": ["Four basic forms in the syllabus: infinitive/base (to write/write), past simple (wrote), present participle (-ing: writing), past participle (written). Third-person singular present form also occurs: writes. Regular verbs: work/worked/working/worked. Irregular: go/went/going/gone; see/saw/seeing/seen; take/took/taking/taken; eat/ate/eating/eaten; do/did/doing/done; buy/bought/buying/bought; be/was or were/being/been.", "Be: am/is/are, was/were, been. Used as a main verb (I am happy) or auxiliary (She is studying; It was built). Have: have/has/had, as possession or perfect auxiliary. Do: do/does/did, as main verb or auxiliary for simple questions and negatives. After do/does/did, use the base verb: Did you go?"], "qs": [{"q": "What is the past participle of write?", "opts": ["written", "wrote", "writing", "writes"], "why": "Written is the past participle."}, {"q": "What is the past simple of buy?", "opts": ["bought", "buyed", "buying", "buys"], "why": "Buy is irregular."}, {"q": "She ___ a doctor.", "opts": ["is", "are", "am", "be"], "why": "She takes is."}, {"q": "___ he have a bicycle?", "opts": ["Does", "Do", "Is", "Has"], "why": "Does forms a present simple question."}, {"q": "Did you ___ your homework?", "opts": ["do", "did", "done", "doing"], "why": "After did, use the base form."}, {"q": "They have ___ the film.", "opts": ["seen", "saw", "see", "seeing"], "why": "Have + past participle forms the perfect."}]}, {"group": "Morphology", "title": "17. Present Simple & Past Simple", "notes": ["Present Simple: routines, facts, states. I/you/we/they work; he/she/it works. Add -es after s/sh/ch/x/o; consonant + y → -ies. Negatives: don't/doesn't + base; questions: Do/Does + subject + base? Be uses am/is/are without do. Signals: usually, always, every day.", "Past Simple: finished actions in a finished past time. Regular -ed (played, stopped, studied), irregular forms (went, saw, had). Negative: didn't + base; question: Did + subject + base? Be: was/were, wasn't/weren't. Signals: yesterday, last week, ago, in 2020. Used to + base expresses a former habit/state: I used to live in Baku; I didn't use to drive; Did you use to play?"], "qs": [{"q": "She usually ___ to school by bus.", "opts": ["goes", "go", "going", "went"], "why": "Third-person singular go → goes."}, {"q": "He doesn't ___ coffee.", "opts": ["drink", "drinks", "drank", "drinking"], "why": "Use base after doesn't."}, {"q": "They ___ the museum yesterday.", "opts": ["visited", "visit", "have visited", "visits"], "why": "Yesterday signals finished past time."}, {"q": "Did she ___ the letter?", "opts": ["write", "wrote", "written", "writes"], "why": "Use base after did."}, {"q": "I ___ play outside every day when I was little.", "opts": ["used to", "use to", "am used to", "was use to"], "why": "Used to describes a past habit."}, {"q": "The children ___ at home last night.", "opts": ["were", "was", "are", "is"], "why": "Plural past form of be is were."}, {"q": "My brother ___ English every evening.", "opts": ["studies", "studys", "study", "studied"], "why": "Consonant + y changes to ies."}]}, {"group": "Morphology", "title": "18. Future Simple", "notes": ["Future Simple: will + base verb. Negative won't (will not); question Will + subject + base? Use for predictions, spontaneous decisions, promises and offers: I think it will rain; I'll help you; I won't tell anyone. Shall can occur with I/we, especially offers/suggestions: Shall we go?", "Time clauses with when, before, after, until, as soon as and real if-clauses usually take present simple for future meaning: I'll call you when I arrive; If it rains, we will stay home. Will belongs in the main clause in these patterns."], "qs": [{"q": "I think she ___ the exam.", "opts": ["will pass", "will passes", "will passed", "passing"], "why": "Will is followed by a base verb."}, {"q": "___ you help me tomorrow?", "opts": ["Will", "Are", "Did", "Have"], "why": "Will forms a future question/request."}, {"q": "I promise I ___ forget.", "opts": ["won't", "am not", "didn't", "won't to"], "why": "Won't is the negative of will."}, {"q": "I'll phone you when I ___.", "opts": ["arrive", "will arrive", "arrived", "arriving"], "why": "Use present simple in future time clauses."}, {"q": "___ we start?", "opts": ["Shall", "Are", "Did", "Has"], "why": "Shall we is used to make a suggestion."}]}, {"group": "Morphology", "title": "19. Present & Past Continuous", "notes": ["Present Continuous: am/is/are + verb-ing. Actions happening now or temporary situations: She is reading now; They are staying with friends this week. Negative: is not reading; question: Is she reading? Spelling: make → making, run → running, lie → lying. State verbs (know, believe, understand, own, like) normally use simple forms in their state meanings.", "Past Continuous: was/were + -ing. An action in progress at a past time, or background action interrupted by a shorter past event: I was reading at 8 p.m.; While we were walking, it started to rain. Use past simple for completed events, continuous for ongoing background."], "qs": [{"q": "Listen! Someone ___.", "opts": ["is singing", "sings", "sang", "sing"], "why": "Listen signals an action in progress."}, {"q": "They ___ dinner at 8 yesterday.", "opts": ["were having", "are having", "has", "was having"], "why": "Plural subject takes were + -ing."}, {"q": "I ___ when the phone rang.", "opts": ["was sleeping", "am sleeping", "sleep", "were sleeping"], "why": "An ongoing past action was interrupted."}, {"q": "Choose the correct -ing form.", "opts": ["running", "runing", "runnning", "runying"], "why": "Double the final consonant in run."}, {"q": "I ___ the answer now.", "opts": ["know", "am knowing", "was knowing", "knowing"], "why": "Know is normally a state verb."}, {"q": "___ she studying at the moment?", "opts": ["Is", "Does", "Has", "Did"], "why": "Invert be for a continuous question."}]}, {"group": "Morphology", "title": "20. Present Perfect", "notes": ["Form: have/has + past participle. I have finished; she has gone; they haven't arrived; Have you seen it? Use for experiences without a finished past time, recent results relevant now, and situations continuing to the present. Common words: ever, never, already, just, yet, since, for, recently.", "Since = starting point (since 2020, since Monday); for = duration (for two years). Already/just usually before participle; yet usually at the end of questions/negatives. Been to = visited and returned; gone to = still away/on the way. Past simple with finished times: I saw him yesterday, not I have seen him yesterday."], "qs": [{"q": "She ___ her homework already.", "opts": ["has finished", "have finished", "has finish", "has finishing"], "why": "She + has + past participle."}, {"q": "Have you ever ___ to London?", "opts": ["been", "went", "go", "going"], "why": "Been to is used for completed visits."}, {"q": "We have lived here ___ 2020.", "opts": ["since", "for", "during", "at"], "why": "Since introduces a starting point."}, {"q": "I haven't seen him ___.", "opts": ["yet", "already", "yesterday", "last year"], "why": "Yet is common at the end of a negative perfect sentence."}, {"q": "I ___ him yesterday.", "opts": ["saw", "have seen", "has seen", "see"], "why": "Yesterday requires past simple."}, {"q": "She has gone to the shop. This means…", "opts": ["she is away now", "she has returned", "she never went", "she goes every day"], "why": "Gone to indicates that she has not yet returned."}]}, {"group": "Morphology", "title": "21. Modal verbs & modal expressions", "notes": ["Can/could: ability, permission or requests (I can swim; Could you help?). Be able to expresses ability in different tenses (will be able to). May/might/could express possibility or prediction (It may rain; He might not come; This could be true). May also expresses permission. Must: strong obligation or deduction; have to: obligation (has to, had to, will have to). Mustn't = prohibition; don't have to = no necessity. Should = advice. Modals take a bare infinitive and do not add -s; have to and be able to change with subject/tense.", "Be about to + base = going to happen very soon (The bus is about to leave). Be due to + base = scheduled/expected (The train is due to arrive at six). Negatives: may not, might not, cannot/can't, couldn't."], "qs": [{"q": "You ___ wear a seat belt; it's required.", "opts": ["must", "might", "could", "may"], "why": "Must expresses obligation."}, {"q": "You ___ touch that wire; it is dangerous.", "opts": ["mustn't", "don't have to", "may", "should"], "why": "Mustn't expresses prohibition."}, {"q": "We ___ come early; it isn't necessary.", "opts": ["don't have to", "mustn't", "can't", "must"], "why": "Don't have to means no obligation."}, {"q": "It ___ snow tonight, but I'm not sure.", "opts": ["might", "must", "has to", "is able to"], "why": "Might expresses possibility."}, {"q": "She will ___ swim after more lessons.", "opts": ["be able to", "can", "could", "able to"], "why": "After will, use be able to rather than can."}, {"q": "The train is ___ leave at 9 according to the timetable.", "opts": ["due to", "about", "able", "due for"], "why": "Be due to describes a scheduled action."}, {"q": "Hurry! The bus is ___ leave.", "opts": ["about to", "about", "due for", "able"], "why": "Be about to means imminent."}, {"q": "You look tired. You ___ rest.", "opts": ["should", "should to", "shoulds", "must to"], "why": "Should + base expresses advice."}]}, {"group": "Morphology", "title": "22. Passive voice", "notes": ["The passive focuses on the receiver of an action. Active: People clean the rooms. Passive: The rooms are cleaned (by people). Form: appropriate form of be + past participle. Present Simple passive: am/is/are + V3; Past Simple passive: was/were + V3; Future Simple passive: will be + V3. The agent with by is optional if unknown or unimportant.", "Negatives add not to the auxiliary: The letters weren't sent. Questions invert the auxiliary: Was it built in 1990? Only verbs that take an object can normally become passive. Keep the original tense when transforming."], "qs": [{"q": "English ___ in many countries.", "opts": ["is spoken", "is spoke", "speaks", "was speak"], "why": "Present passive: is + spoken."}, {"q": "The bridge ___ in 1998.", "opts": ["was built", "is built", "built", "was build"], "why": "Past passive: was + built."}, {"q": "The results ___ tomorrow.", "opts": ["will be announced", "will announced", "will be announce", "are announce"], "why": "Future passive: will be + participle."}, {"q": "Active: They make cars here. Passive: Cars ___ here.", "opts": ["are made", "is made", "were make", "make"], "why": "Plural present passive takes are made."}, {"q": "___ the letter sent yesterday?", "opts": ["Was", "Did", "Does", "Has"], "why": "Invert was in a past passive question."}, {"q": "The windows ___ yesterday.", "opts": ["weren't cleaned", "didn't cleaned", "wasn't clean", "aren't clean"], "why": "Plural past passive negative uses weren't + participle."}]}, {"group": "Morphology", "title": "23. Imperative & infinitive", "notes": ["Imperatives give instructions, requests or orders. Use the base verb without a subject: Open the door. Negative: Don't open the door. Please makes requests more polite. Let's + base suggests doing something together; Let's not + base for negative suggestions.", "The infinitive is to + base (to read); negative not to + base (not to read). Verbs followed by to-infinitives include agree, can't afford, choose, decide, deserve, expect, fail, hope, need, offer, plan, promise, want, wish, would like. Modal expressions: be able to, have to, be about to, be due to. Adjectives can be followed by to-infinitives: happy to see you, important to study."], "qs": [{"q": "Choose the negative imperative.", "opts": ["Don't touch it.", "Not touch it.", "Doesn't touch it.", "You not touch it."], "why": "Don't + base is the negative imperative."}, {"q": "Let's ___ home.", "opts": ["go", "to go", "going", "went"], "why": "Let's is followed by a base verb."}, {"q": "She decided ___ abroad.", "opts": ["to study", "study", "studying", "studied"], "why": "Decide takes a to-infinitive."}, {"q": "He promised ___ late.", "opts": ["not to be", "to not being", "not be", "doesn't be"], "why": "The standard negative infinitive is not to be."}, {"q": "I can't afford ___ a new car.", "opts": ["to buy", "buy", "bought", "buying"], "why": "Can't afford takes to + base."}, {"q": "I am happy ___ you.", "opts": ["to see", "see", "saw", "seen"], "why": "Happy can be followed by a to-infinitive."}]}, {"group": "Morphology", "title": "24. Infinitive patterns: too, enough & object + verb", "notes": ["Too + adjective + to-infinitive means excessively: The box is too heavy to lift. Adjective + enough + to-infinitive means sufficient: She is tall enough to reach it. Enough precedes a noun but follows an adjective/adverb (enough money; old enough; quickly enough).", "Let/make + object + bare infinitive: Let me go; They made him apologise. In passive, made takes to: He was made to apologise. Advise, allow, ask, encourage, expect, invite, teach, tell, want, would like + object + to-infinitive: She told me to wait; I want him to help. Negative: She told me not to wait."], "qs": [{"q": "The bag is too heavy ___ carry.", "opts": ["to", "for", "that", "enough"], "why": "Too + adjective + to-infinitive."}, {"q": "He is ___ to drive.", "opts": ["old enough", "enough old", "too enough old", "enough age"], "why": "Enough follows an adjective."}, {"q": "My father let me ___ out.", "opts": ["go", "to go", "going", "went"], "why": "Let + object + bare infinitive."}, {"q": "The joke made us ___.", "opts": ["laugh", "to laugh", "laughed", "laughing"], "why": "Active make + object + bare infinitive."}, {"q": "She asked me ___ the window.", "opts": ["to open", "open", "opening", "opened"], "why": "Ask + object + to-infinitive."}, {"q": "The teacher encouraged us ___ harder.", "opts": ["to work", "work", "working", "worked"], "why": "Encourage + object + to-infinitive."}, {"q": "He told me ___ the secret.", "opts": ["not to tell", "don't tell", "not tell", "not telling"], "why": "Tell + object + negative to-infinitive."}]}, {"group": "Morphology", "title": "25. Gerunds", "notes": ["A gerund is a verb-ing form used in a noun-like role: Swimming is fun. Negative: not going, not writing. Use a gerund after these verbs/expressions in the syllabus: can't help, enjoy, imagine, keep, mind, miss, practise (US practice), recommend, risk, suggest, avoid (additional common pattern). Examples: I enjoy reading; She suggested taking the bus; Would you mind opening the window?", "After a preposition, use a noun or gerund: interested in learning, proud of getting good grades, good at drawing, before leaving, without saying goodbye. Do not confuse a gerund with the continuous participle: Swimming is fun (gerund); She is swimming (continuous verb form). Some verbs allow both forms with different meanings; focus on the listed patterns."], "qs": [{"q": "He enjoys ___ books.", "opts": ["reading", "to read", "read", "reads"], "why": "Enjoy takes a gerund."}, {"q": "She suggested ___ by bus.", "opts": ["going", "to go", "go", "went"], "why": "Suggest is followed by a gerund in this pattern."}, {"q": "Would you mind ___ the door?", "opts": ["closing", "to close", "close", "closed"], "why": "Mind takes a gerund."}, {"q": "He is good at ___.", "opts": ["drawing", "to draw", "draw", "drew"], "why": "Use a gerund after a preposition."}, {"q": "I can't help ___ when I see that video.", "opts": ["laughing", "to laugh", "laugh", "laughed"], "why": "Can't help + gerund means cannot stop oneself."}, {"q": "She left without ___ goodbye.", "opts": ["saying", "to say", "say", "said"], "why": "Without is a preposition followed by -ing."}, {"q": "They risk ___ the match.", "opts": ["losing", "to lose", "lose", "lost"], "why": "Risk takes a gerund."}]}, {"group": "Morphology", "title": "26. Adverbs: types, position & degree", "notes": ["Adverbs modify verbs, adjectives, other adverbs or whole clauses. Place: here, there, outside. Time: now, yesterday, soon. Frequency: always, usually, often, sometimes, rarely, never. Manner: slowly, politely, well, fast. Interrogative adverbs: when, where, how, why. Degree/measure: very, too, enough, quite, almost.", "Frequency adverbs usually go before main verbs (She often reads), after be (He is always late), or after the first auxiliary (She has never been there). Manner often follows the verb/object (She speaks English fluently). Very = high degree; too = more than desirable; enough = sufficient (fast enough). Compare adverbs: fast/faster/fastest, carefully/more carefully/most carefully, well/better/best."], "qs": [{"q": "She speaks English ___.", "opts": ["fluently", "fluent", "fluency", "more fluent"], "why": "Fluently describes how she speaks."}, {"q": "Choose the normal frequency position.", "opts": ["He is always late.", "He is late every always.", "He always late is.", "He late is always."], "why": "Frequency adverbs normally follow be."}, {"q": "He runs fast ___ to win.", "opts": ["enough", "too", "very", "much"], "why": "Enough follows an adverb."}, {"q": "The tea is ___ hot to drink.", "opts": ["too", "very", "enough", "many"], "why": "Too means excessively hot."}, {"q": "___ did you leave? — At six.", "opts": ["When", "Where", "Why", "How"], "why": "When asks about time."}, {"q": "Which adverb expresses place?", "opts": ["outside", "often", "slowly", "yesterday"], "why": "Outside tells where."}]}, {"group": "Morphology", "title": "27. Prepositions", "notes": ["Place: in (inside), on (surface), at (point), next to (beside), behind, between (two or distinct items), opposite, in front of, around/round, by (near), under. Movement: to (destination), from (origin), into (entering), out of (leaving), through (passing inside), off (away from a surface), around (movement around). Example: Walk through the park and turn left.", "Time: at 7, on Monday/24 May, in June/2027/the morning; before, after, since (start), for (duration), till/until (up to a time). Other relations: of (relationship), by (agent/means/deadline), with (accompaniment/instrument), without (absence), for (purpose/recipient), about (topic). Common combinations: interested in, good at, afraid of, listen to, wait for. At night is an exception to in the morning/afternoon/evening."], "qs": [{"q": "We meet ___ Monday.", "opts": ["on", "in", "at", "to"], "why": "Use on with days."}, {"q": "The lesson starts ___ 9 o'clock.", "opts": ["at", "on", "in", "from"], "why": "Use at for exact clock times."}, {"q": "She walked ___ the room and sat down.", "opts": ["into", "on", "at", "off"], "why": "Into expresses movement inside."}, {"q": "The cat is hiding ___ the table, below it.", "opts": ["under", "on", "opposite", "between"], "why": "Under means below."}, {"q": "The bank is ___ the school and the library.", "opts": ["between", "among", "into", "through"], "why": "Between links the two named places."}, {"q": "We've lived here ___ three years.", "opts": ["for", "since", "at", "until"], "why": "For introduces duration."}, {"q": "He cut the paper ___ scissors.", "opts": ["with", "by", "of", "about"], "why": "With introduces an instrument."}, {"q": "The novel was written ___ a famous author.", "opts": ["by", "with", "of", "from"], "why": "By introduces a passive agent."}]}, {"group": "Morphology", "title": "28. Conjunctions", "notes": ["Coordinating conjunctions join equal units: and (addition), but (contrast), or (choice), so (result). Subordinating conjunctions introduce dependent clauses: because/as (reason), if (condition), before/after/since/when/while (time), that (content), than (comparison). As can also express time/manner/comparison. Examples: I stayed home because I was ill; I was reading while she was cooking; I know that he is honest.", "Paired conjunctions: both…and, either…or, neither…nor, not only…but also. Join parallel structures: She likes both tea and coffee. With either/or or neither/nor and unlike subjects, the verb often agrees with the nearer subject: Neither the teacher nor the students are ready. Comparison: as…as, not as/so…as, than."], "qs": [{"q": "I was hungry, ___ I made a sandwich.", "opts": ["so", "because", "but", "or"], "why": "So introduces a result."}, {"q": "He stayed home ___ he was ill.", "opts": ["because", "so", "or", "than"], "why": "Because introduces a reason."}, {"q": "You can have either tea ___ coffee.", "opts": ["or", "nor", "and", "but"], "why": "Either pairs with or."}, {"q": "She likes neither maths ___ history.", "opts": ["nor", "or", "and", "so"], "why": "Neither pairs with nor."}, {"q": "He is not only clever ___ also kind.", "opts": ["but", "and", "or", "nor"], "why": "Not only pairs with but also."}, {"q": "I was studying ___ my brother was playing.", "opts": ["while", "than", "so", "or"], "why": "While expresses simultaneous actions."}, {"q": "She is taller ___ her sister.", "opts": ["than", "as", "that", "then"], "why": "Than follows a comparative."}]}, {"group": "Syntax", "title": "29. Collocations & sentence types", "notes": ["Collocations are words that naturally go together: strong wind, heavy rain, make a decision, do homework, take a photo, pay attention, catch a bus, fast food, tell the truth, visit grandparents. A collocation is not always predictable from translation.", "A simple sentence contains one independent clause. Types by communicative purpose: declarative (statement, affirmative or negative: She works; She doesn't work), interrogative (question: Does she work?), imperative (command/request: Please sit down). Exclamations express strong feelings (What a lovely day!). A simple sentence may contain a compound subject or verb without becoming a compound sentence."], "qs": [{"q": "Choose the natural collocation.", "opts": ["make a decision", "do a decision", "perform a decision", "put a decision"], "why": "Make a decision is a widely used collocation."}, {"q": "Choose the natural collocation.", "opts": ["heavy rain", "weighty rain", "hardly rain", "bigly rain"], "why": "Heavy rain is the standard collocation."}, {"q": "Choose the correct expression.", "opts": ["do homework", "make homework", "take homework", "do a homework"], "why": "Do homework means perform the task."}, {"q": "Which is a negative declarative sentence?", "opts": ["She doesn't swim.", "Does she swim?", "Don't swim.", "What a swim!"], "why": "It states a negative fact."}, {"q": "Which is an imperative?", "opts": ["Please close the door.", "Did you close the door?", "He closes the door.", "The door is closed."], "why": "It gives a request."}, {"q": "Ali and Leyla sang and danced. This is…", "opts": ["a simple sentence", "a complex sentence", "two sentences", "a question"], "why": "There is one independent clause with a compound subject and verb."}]}, {"group": "Syntax", "title": "30. Questions: general, special, choice & tag", "notes": ["General (yes/no): invert be/auxiliary/modal, or use do/does/did: Are you ready? Does she work? Special (wh-): who, whom, what, whose, which, what kind of, how many/much, when, where, how, why, how long, how often, how well, how far, since when. Object questions use auxiliary + subject + base: Who did you see? Subject questions do not need do: Who broke the window?", "Choice/alternative: Do you want tea or coffee? Disjunctive/tag questions: positive statement + negative tag (She is here, isn't she?); negative statement + positive tag (They didn't go, did they?). Match the auxiliary, tense and pronoun. Special patterns: I am late, aren't I? Let's go, shall we? Never is negative in meaning: He never calls, does he?"], "qs": [{"q": "___ she like music?", "opts": ["Does", "Do", "Is", "Has"], "why": "Use does with third-person present simple."}, {"q": "___ broke the window?", "opts": ["Who", "Who does", "Whom did", "Whose did"], "why": "Who is the subject, so no do is needed."}, {"q": "___ did you buy? — A new phone.", "opts": ["What", "Who", "Where", "When"], "why": "What asks about a thing."}, {"q": "___ do you go swimming? — Twice a week.", "opts": ["How often", "How far", "How long", "How well"], "why": "How often asks frequency."}, {"q": "___ is the station? — Two kilometres away.", "opts": ["How far", "How much", "How many", "How often"], "why": "How far asks distance."}, {"q": "She can swim, ___?", "opts": ["can't she", "doesn't she", "can she", "isn't she"], "why": "Use a negative tag after an affirmative modal statement."}, {"q": "He didn't call, ___?", "opts": ["did he", "didn't he", "does he", "is he"], "why": "A negative statement takes a positive tag."}, {"q": "Would you like tea or coffee? This is…", "opts": ["a choice question", "a tag question", "an imperative", "a subject question"], "why": "It offers alternatives."}, {"q": "___ have you been waiting? — For an hour.", "opts": ["How long", "How far", "How many", "How well"], "why": "How long asks duration."}]}, {"group": "Syntax", "title": "31. Sentence parts, agreement & word order", "notes": ["Main parts: subject (who/what the sentence is about) and predicate (what is said about it). Secondary parts: object (direct/indirect), attribute/modifier (describes noun), adverbial modifier (time/place/manner etc.). In The clever girl gave her friend a book yesterday: subject = the clever girl; verb = gave; indirect object = her friend; direct object = a book; attribute = clever; adverbial = yesterday.", "Agreement: singular subject takes singular verb, plural takes plural. Watch words between subject and verb: The box of pencils is heavy. Each/every and everyone normally take singular; two subjects joined by and normally take plural. Word order: subject + verb + object/complement + adverbials; manner often before place before time (She worked quietly at home yesterday). Questions invert auxiliary; negatives need correct auxiliary."], "qs": [{"q": "In 'The boy reads books', what is the subject?", "opts": ["The boy", "reads", "books", "reads books"], "why": "The boy performs the action."}, {"q": "In 'She bought a red bag yesterday', what is the direct object?", "opts": ["a red bag", "yesterday", "She", "bought"], "why": "The direct object receives the action."}, {"q": "The box of pencils ___ heavy.", "opts": ["is", "are", "have", "were"], "why": "The head noun box is singular."}, {"q": "Every student ___ a book.", "opts": ["has", "have", "having", "are having"], "why": "Every + singular noun takes singular agreement."}, {"q": "Ali and Leyla ___ friends.", "opts": ["are", "is", "am", "be"], "why": "Two subjects joined with and usually take plural agreement."}, {"q": "Choose the normal neutral word order.", "opts": ["She reads books at home.", "Reads she books at home.", "She books reads at home.", "At reads home she books."], "why": "Subject + verb + object + place."}, {"q": "In 'She spoke softly', softly is…", "opts": ["an adverbial modifier", "the subject", "a direct object", "a noun attribute"], "why": "It tells how she spoke."}]}, {"group": "Syntax", "title": "32. Agreement replies: so, neither, too, also, either", "notes": ["To agree with an affirmative statement: So + matching auxiliary + subject (I like tea. — So do I.); subject + auxiliary + too (I do, too). For negative agreement: Neither + auxiliary + subject (I don't like tea. — Neither do I.); subject + negative auxiliary + either (I don't, either). Match the tense or modal: So am I, So did I, So can I, Neither have I.", "Also normally goes before the main verb, after be, or after the first auxiliary: She also plays tennis; He is also tired; I have also seen it. Too usually at the end of an affirmative clause; either usually at the end of a negative clause. Distinguish either (negative addition) from either of two choices."], "qs": [{"q": "I love music. — ___.", "opts": ["So do I", "Neither do I", "So am I", "So did I"], "why": "Present simple affirmative agreement uses so do I."}, {"q": "I can't swim. — ___.", "opts": ["Neither can I", "So can I", "Neither do I", "So do I"], "why": "Match the negative modal can."}, {"q": "She went to the cinema. — ___.", "opts": ["So did I", "So do I", "Neither did I", "So was I"], "why": "Past simple uses did."}, {"q": "I haven't finished. — I haven't finished, ___.", "opts": ["either", "too", "also", "so"], "why": "Either adds a negative agreement."}, {"q": "Choose the normal position.", "opts": ["She also likes music.", "She likes music neither.", "She likes also to music.", "She too likes not music."], "why": "Also typically precedes the main verb."}, {"q": "I am tired. — ___.", "opts": ["So am I", "So do I", "So have I", "Neither am I"], "why": "Match the verb be."}]}, {"group": "Syntax", "title": "33. Impersonal sentences & introductory there", "notes": ["English normally requires a subject, even when there is no real person or thing doing an action. Impersonal it: It is cold; It is early; It is morning; It is raining; It is five o'clock; It is far from here. It can introduce an adjective + infinitive: It is important to study.", "There is/are introduces existence or presence: There is a book on the table; There are two books. Past: there was/were; future: there will be. Questions: Is there…? Are there…? Negatives: There isn't any milk; There aren't any chairs. In standard exam English use agreement with the following noun phrase. Contrast It is cold (weather) and There is a cold wind (existence)."], "qs": [{"q": "___ is raining outside.", "opts": ["It", "There", "They", "He"], "why": "Impersonal it is used for weather."}, {"q": "___ are three books on the table.", "opts": ["There", "It", "He", "This"], "why": "There are introduces plural existence."}, {"q": "There ___ some water in the glass.", "opts": ["is", "are", "were", "have"], "why": "Water is uncountable and takes singular agreement."}, {"q": "___ is important to practise every day.", "opts": ["It", "There", "They", "We"], "why": "Introductory it precedes adjective + infinitive."}, {"q": "___ there any chairs yesterday?", "opts": ["Were", "Was", "Are", "Did"], "why": "Past plural question uses were there."}, {"q": "There ___ be a meeting tomorrow.", "opts": ["will", "is", "are", "has"], "why": "There will be expresses future existence."}]}, {"group": "Syntax", "title": "34. Compound & complex sentences; time clauses", "notes": ["A compound sentence joins two or more independent clauses with a coordinator (and, but, or, so): I was tired, but I finished my work. A complex sentence contains an independent clause and at least one dependent clause: I stayed home because I was sick. A dependent clause cannot normally stand alone as a complete sentence.", "Adverbial clauses of time use when, while, before, after, until/till, since, as soon as. If the subordinate clause comes first, a comma is usual: When I get home, I will call you. For future time, use present simple (or another appropriate present form) in the time clause, not ordinary future will. Past background: While I was reading, the phone rang."], "qs": [{"q": "I wanted to go out, but it was raining. This is…", "opts": ["a compound sentence", "a simple sentence", "a complex sentence", "an imperative"], "why": "Two independent clauses are joined by but."}, {"q": "I stayed home because I was ill. This is…", "opts": ["a complex sentence", "a compound sentence", "a question", "a simple sentence"], "why": "Because introduces a dependent clause."}, {"q": "I'll call you as soon as I ___.", "opts": ["arrive", "will arrive", "arrived", "arriving"], "why": "Future time clauses normally use present simple."}, {"q": "Wait here until she ___.", "opts": ["returns", "will return", "return", "returned"], "why": "Until introduces a future time clause with present simple."}, {"q": "___ I was cooking, he was reading.", "opts": ["While", "Than", "Or", "So"], "why": "While connects simultaneous actions."}, {"q": "Which is a dependent clause?", "opts": ["because she was ill", "She was ill.", "He left.", "They arrived."], "why": "Because introduces a clause that depends on another clause."}]}, {"group": "Syntax", "title": "35. Real conditional clauses (zero & first)", "notes": ["A conditional clause expresses a condition. Zero conditional: if + present simple, present simple — facts and general truths: If you heat ice, it melts. When may replace if in many general truths. First conditional: if + present simple, will + base — real or possible future: If it rains tomorrow, we will stay home. The main clause can also use can, may or an imperative: If you need help, call me.", "Either order is possible: If you hurry, you will catch the bus. You will catch the bus if you hurry. Use a comma after an introductory if-clause. Unless means if not (additional useful form): Unless you hurry, you will miss the bus. Do not ordinarily use will in the if-clause for these real conditional patterns."], "qs": [{"q": "If you heat water to 100°C at standard pressure, it ___.", "opts": ["boils", "will boiling", "boil", "boiled"], "why": "Zero conditional expresses a scientific fact with present simple."}, {"q": "If it rains tomorrow, we ___ at home.", "opts": ["will stay", "stayed", "will staying", "stays"], "why": "First conditional: if + present, will + base."}, {"q": "If you ___ now, you will catch the bus.", "opts": ["leave", "will leave", "left", "leaving"], "why": "The real future condition uses present simple."}, {"q": "Unless you hurry, you will miss the bus. Unless means…", "opts": ["if you do not", "because you", "when you always", "although you"], "why": "Unless expresses a negative condition."}, {"q": "Choose the correctly punctuated sentence.", "opts": ["If you study, you will pass.", "If, you study you will pass.", "If you study you, will pass.", "If you, study you will pass."], "why": "A comma follows an introductory conditional clause."}, {"q": "If you need help, ___ me.", "opts": ["call", "will calling", "called", "to call"], "why": "An imperative can be the main clause in a real conditional."}]}];

function choose(index,o){let item=exam[index];if(!item||examSubmitted&&mode==='exam')return;if(mode==='lesson'&&answers[item.id]!==undefined)return;answers[item.id]=o;if(mode==='lesson'||mode==='review'){remember(item,o);save();$('q'+index).outerHTML=qHtml(item,index,true);if(mode==='lesson')updateLessonScore();else updateReviewScore()}else{$('q'+index).outerHTML=qHtml(item,index,false);$('liveScore').textContent=Object.keys(answers).length+' / '+exam.length+' answered'}}
function updateLessonScore(){let n=Object.keys(answers).length,c=Object.values(answers).filter(x=>x===0).length;$('liveScore').textContent=n+' / '+exam.length+' answered · '+c+' correct';if(n===exam.length){let pct=Math.round(c/n*100);state.best[current]=Math.max(state.best[current]||0,pct);save();$('lessonResult').innerHTML='<div class="feedback '+(pct>=80?'good':'bad')+'"><strong>'+c+' / '+n+' · '+pct+'%</strong> — '+(pct>=80?'Lesson mastered! Continue to the next topic.':'Review the explanations and try this lesson again.')+'</div>'}}
function examSetup(){mode='setup';current=-1;renderNav();main.innerHTML=mobileSelector()+'<section class="panel"><div class="eyebrow">Exam practice</div><h2>Mixed test</h2><p>Questions are randomly sampled across the selected topics. Answers and explanations appear after submission.</p><div class="bar"><label>Topics <select id="examGroup"><option value="all">All four areas</option>'+['Phonetics','Lexicology','Morphology','Syntax'].map(g=>'<option>'+g+'</option>').join('')+'</select></label><label>Questions <select id="examCount"><option>15</option><option selected>30</option><option>50</option><option value="all">All available</option></select></label></div><button class="btn" onclick="startExam()">Start test</button></section>';goTop()}
function startExam(){let group=$('examGroup').value,count=$('examCount').value;let pool=lessons.flatMap((l,i)=>group==='all'||l.group===group?l.qs.map((q,j)=>makeItem(i,j)):[]);exam=shuffle(pool).slice(0,count==='all'?pool.length:Math.min(+count,pool.length));answers={};examSubmitted=false;mode='exam';renderExam();goTop()}
function renderExam(){main.innerHTML='<section class="panel"><div class="eyebrow">Mixed exam</div><h2>'+exam.length+' questions</h2><p id="liveScore" class="small">'+Object.keys(answers).length+' / '+exam.length+' answered</p><div id="examResult"></div>'+exam.map((it,i)=>qHtml(it,i,false)).join('')+'<div class="bar">'+(examSubmitted?'<button class="btn" onclick="examSetup()">New test</button><button class="btn secondary" onclick="reviewMistakes()">Review mistakes</button>':'<button class="btn" onclick="submitExam()">Submit test</button>')+'</div></section>'}
function submitExam(){let un=exam.length-Object.keys(answers).length;if(un&&!confirm(un+' unanswered questions. Submit anyway?'))return;examSubmitted=true;exam.forEach(it=>remember(it,answers[it.id]));save();renderExam();let c=Object.values(answers).filter(x=>x===0).length;let groups={};exam.forEach(it=>{let g=lessons[it.li].group;groups[g]??=[0,0];groups[g][1]++;if(answers[it.id]===0)groups[g][0]++});$('examResult').innerHTML='<div class="stats"><div class="stat"><strong>'+Math.round(c/exam.length*100)+'%</strong><span>Overall score</span></div><div class="stat"><strong>'+c+'/'+exam.length+'</strong><span>Correct answers</span></div></div><div class="feedback">'+Object.entries(groups).map(([g,v])=>esc(g)+': '+v[0]+'/'+v[1]+' ('+Math.round(v[0]/v[1]*100)+'%)').join('<br>')+'</div><p>Review the answers below, then practise any weak topics.</p>';goTop()}
function reviewMistakes(){mode='review';current=-1;examSubmitted=false;answers={};exam=Object.keys(state.wrong).map(id=>id.split('-').map(Number)).filter(([i,j])=>lessons[i]&&lessons[i].qs[j]).map(([i,j])=>makeItem(i,j));renderNav();main.innerHTML=mobileSelector()+'<section class="panel"><div class="eyebrow">Targeted revision</div><h2>Review mistakes</h2><p>Answer incorrectly answered or skipped questions again. Correct answers remove them from your review list.</p><p id="reviewScore" class="small"></p>'+(exam.length?exam.map((it,i)=>'<div class="tag">'+esc(lessons[it.li].title)+'</div>'+qHtml(it,i,true)).join(''):'<div class="feedback good">No questions to review yet. Complete a lesson or a mixed test first.</div>')+'<div class="bar"><button class="btn" onclick="reviewMistakes()">Refresh review list</button><button class="btn secondary" onclick="goHome()">Course home</button></div></section>';updateReviewScore();goTop()}
function updateReviewScore(){let c=Object.values(answers).filter(x=>x===0).length;$('reviewScore').textContent=c+' / '+exam.length+' corrected this session'}
function resetProgress(){if(confirm('Reset all saved lesson scores and mistakes?')){state={best:{},wrong:{},attempted:{},last:0};save();goHome()}}
progress();goHome();
</script></body></html>
